services:
  - type: web
    name: brain-mri-api
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn brain_mri_api.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brain_mri_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: brain_mri_db
    plan: free